<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لعبة حجر ورقة مقص - معتز ناجي</title>
    <style>
        body { background-color: #0d1117; color: #ffffff; font-family: Tahoma, sans-serif; text-align: center; padding: 20px; margin: 0; }
        .box { background-color: #161b22; padding: 25px; border-radius: 12px; max-width: 450px; margin: 30px auto; border-top: 4px solid #a855f7; box-shadow: 0 4px 15px rgba(0,0,0,0.6); text-align: right; }
        h1 { color: #c084fc; margin-bottom: 5px; text-align: center; font-size: 1.4rem; }
        p.subtitle { color: #8b949e; font-size: 0.85rem; margin-bottom: 20px; text-align: center; }
        
        .score-board { display: flex; justify-content: space-around; background-color: #21262d; padding: 12px; border-radius: 8px; border: 1px solid #30363d; margin-bottom: 20px; font-size: 0.95rem; text-align: center; }
        .score-item strong { color: #facc15; font-size: 1.2rem; display: block; margin-top: 4px; }

        .choices { display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; }
        .choice-btn { background-color: #21262d; border: 2px solid #30363d; border-radius: 10px; font-size: 2rem; padding: 12px 20px; cursor: pointer; transition: 0.2s; }
        .choice-btn:hover { border-color: #c084fc; background-color: #30363d; }

        .result-box { background-color: #0d1117; padding: 15px; border-radius: 8px; border: 1px solid #30363d; text-align: center; font-size: 1rem; color: #58a6ff; margin-bottom: 15px; min-height: 40px; line-height: 1.5; }
        
        .reset-btn { background-color: #30363d; color: white; border: none; width: 100%; padding: 10px; border-radius: 6px; cursor: pointer; font-family: Tahoma, sans-serif; font-size: 0.9rem; }
        .reset-btn:hover { background-color: #484f58; }
    </style>
</head>
<body>

    <div class="box">
        <h1>حجر، ورقة، مقص</h1>
        <p.subtitle>اختر عنصراً وتحدى الكمبيوتر في كل جولة</p>
        
        <div class="score-board">
            <div class="score-item">نقاطك <strong id="playerScore">0</strong></div>
            <div class="score-item">التعادل <strong id="drawScore">0</strong></div>
            <div class="score-item">نقاط الكمبيوتر <strong id="computerScore">0</strong></div>
        </div>

        <div class="choices">
            <button class="choice-btn" onclick="play('حجر')">🪨</button>
            <button class="choice-btn" onclick="play('ورقة')">📄</button>
            <button class="choice-btn" onclick="play('مقص')">✂️</button>
        </div>

        <div class="result-box" id="resultMsg">اختر إحدى الأيقونات في الأعلى لبدء التحدي!</div>

        <button class="reset-btn" onclick="resetGame()">إعادة ضبط النقاط</button>
    </div>

    <script>
        let pScore = 0;
        let cScore = 0;
        let dScore = 0;

        function play(playerChoice) {
            const choices = ['حجر', 'ورقة', 'مقص'];
            const emojis = { 'حجر': '🪨', 'ورقة': '📄', 'مقص': '✂️' };
            const computerChoice = choices[Math.floor(Math.random() * choices.length)];

            const msgBox = document.getElementById("resultMsg");

            if (playerChoice === computerChoice) {
                dScore++;
                document.getElementById("drawScore").innerText = dScore;
                msgBox.innerHTML = `تعادل! 🤝 اخترت أنت (${emojis[playerChoice]}) واختار الكمبيوتر (${emojis[computerChoice]}).`;
                msgBox.style.color = "#facc15";
            } else if (
                (playerChoice === 'حجر' && computerChoice === 'مقص') ||
                (playerChoice === 'ورقة' && computerChoice === 'حجر') ||
                (playerChoice === 'مقص' && computerChoice === 'ورقة')
            ) {
                pScore++;
                document.getElementById("playerScore").innerText = pScore;
                msgBox.innerHTML = `🎉 مبروك يا معتز، لقد ربحت الجولة! <br>اخترت (${emojis[playerChoice]}) والكمبيوتر (${emojis[computerChoice]}).`;
                msgBox.style.color = "#2ea043";
            } else {
                cScore++;
                document.getElementById("computerScore").innerText = cScore;
                msgBox.innerHTML = `❌ فاز الكمبيوتر في هذه الجولة!<br>اخترت (${emojis[playerChoice]}) والكمبيوتر (${emojis[computerChoice]}).`;
                msgBox.style.color = "#f85149";
            }
        }

        function resetGame() {
            pScore = 0;
            cScore = 0;
            dScore = 0;
            document.getElementById("playerScore").innerText = pScore;
            document.getElementById("computerScore").innerText = cScore;
            document.getElementById("drawScore").innerText = dScore;
            document.getElementById("resultMsg").innerHTML = "تمت إعادة ضبط النقاط. اختر إحدى الأيقونات لبدء اللعب!";
            document.getElementById("resultMsg").style.color = "#58a6ff";
        }
    </script>

</body>
</html>
