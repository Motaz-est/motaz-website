<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>موقع معتز ناجي الرسمي</title>
    <style>
        body { background-color: #111827; color: #ffffff; font-family: Tahoma, sans-serif; text-align: center; padding: 20px; }
        .logo { width: 150px; height: 150px; border-radius: 50%; border: 4px solid #eab308; margin-bottom: 20px; }
        .box { background-color: #1f2937; padding: 20px; border-radius: 12px; max-width: 600px; margin: 20px auto; border-top: 4px solid #eab308; }
        h1 { color: #eab308; }
        p { margin: 10px 0; font-size: 1.1rem; }
    </style>
</head>
<body>

    <!-- إضافة الشعار من جديد -->
    <img src="https://upload.wikimedia.org/wikipedia/en/thumb/e/e4/Esp%C3%A9rance_Sportive_de_Tunis_logo.svg/1200px-Esp%C3%A9rance_Sportive_de_Tunis_logo.svg.png" alt="شعار الترجي" class="logo">
    
    <h1>موقع معتز ناجي - الترجي الرياضي</h1>

    <div class="box">
        <h2>التشكيلة المعدلة للترجي</h2>
        <p><strong>حارس:</strong> منتصر الصيد</p>
        <p><strong>دفاع:</strong> محمد دراغر - الياس عرعار - الشيخاوي - الصحراوي</p>
        <p><strong>وسط:</strong> كاستيلو - رفيعة - الحاج محمود</p>
        <p><strong>هجوم:</strong> ريبيرو - البلايلي - بالطيب</p>
    </div>

    <div class="box">
        <h2>الأهازيج</h2>
        <p>يا ترجي يا دولة</p>
        <p>غول إفريقيا</p>
    </div>

</body>
</html>
