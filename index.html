<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>موقع معتز ناجي</title>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background-color: #1e293b; padding: 20px; border-radius: 10px; margin: 10px auto; max-width: 500px; border-right: 5px solid #dc2626; }
        h2 { color: #facc15; }
    </style>
</head>
<body>

    <div class="card">
        <h2>تشكيلة الفريق</h2>
        <p><strong>حارس:</strong> منتصر الصيد</p>
        <p><strong>دفاع:</strong> محمد دراغر - الياس عرعار - الشيخاوي - الصحراوي</p>
        <p><strong>وسط:</strong> كاستيلو - رفيعة - الحاج محمود</p>
        <p><strong>هجوم:</strong> ريبيرو - البلايلي - بالطيب</p>
    </div>

    <div class="card">
        <h2>أهازيج غول إفريقيا</h2>
        <p>"يا ترجي يا دولة"</p>
        <p>"غول إفريقيا"</p>
    </div>

</body>
</html>
