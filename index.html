<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع معتز ناجي الرسمي | الترجي</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; line-height: 1.6; }
        header { background: linear-gradient(135deg, #1e293b, #0f172a); padding: 30px 20px; text-align: center; border-bottom: 3px solid #dc2626; }
        .logo { width: 120px; height: 120px; margin-bottom: 15px; border-radius: 50%; border: 3px solid #facc15; }
        header h1 { font-size: 2rem; color: #facc15; margin-bottom: 5px; }
        header p { color: #94a3b8; font-size: 1rem; }
        .container { max-width: 800px; margin: 30px auto; padding: 0 20px; }
        .card { background-color: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; border-right: 5px solid #dc2626; }
        .card h2 { color: #facc15; margin-bottom: 10px; }
        li { background: #0f172a; margin: 5px 0; padding: 8px; border-radius: 6px; list-style: none; border: 1px solid #334155; }
        .footer { text-align: center; padding: 20px; color: #64748b; font-size: 0.8rem; margin-top: 30px; }
    </style>
</head>
<body>

    <header>
        <img src="https://upload.wikimedia.org/wikipedia/en/thumb/e/e4/Esp%C3%A9rance_Sportive_de_Tunis_logo.svg/1200px-Esp%C3%A9rance_Sportive_de_Tunis_logo.svg.png" alt="شعار الترجي" class="logo">
        <h1>الترجي الرياضي التونسي</h1>
        <p>الموقع الرسمي | معتز ناجي</p>
    </header>

    <div class="container">
        <div class="card">
            <h2>تشكيلة الفريق</h2>
            <ul>
                <li><strong>حارس:</strong> منتصر الصيد</li>
                <li><strong>دفاع:</strong> محمد دراغر - الياس عرعار</li>
                <li><strong>وسط:</strong> الشيخاوي - الصحراوي - كاستيلو - رفيعة - الحاج محمود</li>
                <li><strong>هجوم:</strong> ريبيرو - البلايلي - بالطيب</li>
            </ul>
        </div>
    </div>

    <div class="footer">
        <p>جميع الحقوق محفوظة &copy; 2026 - معتز ناجي</p>
    </div>

</body>
</html>
