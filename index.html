<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>حاسبة الوقت الدقيقة - معتز ناجي</title>
    <style>
        body { background-color: #0d1117; color: #ffffff; font-family: Tahoma, sans-serif; text-align: center; padding: 20px; margin: 0; }
        .box { background-color: #161b22; padding: 25px; border-radius: 12px; max-width: 500px; margin: 30px auto; border-top: 4px solid #3b82f6; box-shadow: 0 4px 15px rgba(0,0,0,0.6); text-align: right; }
        h1 { color: #60a5fa; margin-bottom: 5px; text-align: center; font-size: 1.4rem; }
        p.subtitle { color: #8b949e; font-size: 0.85rem; margin-bottom: 20px; text-align: center; }
        
        .input-group { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
        .input-group label { color: #c9d1d9; font-size: 0.9rem; }
        .date-input { padding: 10px; border-radius: 6px; border: 1px solid #30363d; background-color: #0d1117; color: white; font-family: Tahoma, sans-serif; font-size: 1rem; width: 100%; box-sizing: border-box; }
        
        .calc-btn { background-color: #1f6feb; color: white; border: none; width: 100%; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-family: Tahoma, sans-serif; font-size: 1rem; }
        .calc-btn:hover { background-color: #388bfd; }

        .results { margin-top: 25px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .result-card { background-color: #21262d; padding: 15px; border-radius: 8px; border: 1px solid #30363d; text-align: center; }
        .result-number { font-size: 1.3rem; color: #facc15; font-weight: bold; margin-bottom: 5px; font-family: monospace; }
        .result-label { font-size: 0.85rem; color: #8b949e; }
    </style>
</head>
<body>

    <div class="box">
        <h1>حاسبة الوقت والعمر الدقيقة</h1>
        <p class="subtitle">اختر تاريخ ميلادك أو أي تاريخ لاكتشاف التفاصيل بالكامل</p>
        
        <div class="input-group">
            <label for="birthDate">اختر التاريخ:</label>
            <input type="date" id="birthDate" class="date-input">
        </div>

        <button class="calc-btn" onclick="calculateTime()">احسب التفاصيل</button>

        <div class="results" id="resultsArea" style="display: none;">
            <div class="result-card">
                <div class="result-number" id="yearsCount">0</div>
                <div class="result-label">سنوات</div>
            </div>
            <div class="result-card">
                <div class="result-number" id="monthsCount">0</div>
                <div class="result-label">شهور تقريبية</div>
            </div>
            <div class="result-card">
                <div class="result-number" id="daysCount">0</div>
                <div class="result-label">إجمالي الأيام</div>
            </div>
            <div class="result-card">
                <div class="result-number" id="hoursCount">0</div>
                <div class="result-label">إجمالي الساعات</div>
            </div>
        </div>
    </div>

    <script>
        function calculateTime() {
            const inputVal = document.getElementById("birthDate").value;
            if (!inputVal) {
                alert("الرجاء اختيار تاريخ صحيح أولاً!");
                return;
            }

            const birthDate = new Date(inputVal);
            const now = new Date();

            if (birthDate > now) {
                alert("التاريخ المدخل في المستقبل!");
                return;
            }

            let years = now.getFullYear() - birthDate.getFullYear();
            let months = now.getMonth() - birthDate.getMonth();
            let days = now.getDate() - birthDate.getDate();

            if (days < 0) {
                months--;
                const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
                days += prevMonth.getDate();
            }

            if (months < 0) {
                years--;
                months += 12;
            }

            const diffTime = Math.abs(now - birthDate);
            const totalDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            const totalHours = Math.floor(diffTime / (1000 * 60 * 60));

            document.getElementById("yearsCount").innerText = years;
            document.getElementById("monthsCount").innerText = (years * 12) + months;
            document.getElementById("daysCount").innerText = totalDays.toLocaleString();
            document.getElementById("hoursCount").innerText = totalHours.toLocaleString();

            document.getElementById("resultsArea").style.display = "grid";
        }

        // وضع تاريخ افتراضي (مثلاً سنة 2011) لتسهيل التجربة
        document.getElementById("birthDate").value = "2005-01-01";
        calculateTime();
    </script>

</body>
</html>
