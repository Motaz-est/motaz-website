<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>موقعي الشخصي - معتز ناجي</title>
    <style>
        body {
            background-color: #f4f7f6;
            font-family: Tahoma, sans-serif;
            text-align: center;
            margin: 0;
            padding: 50px 20px;
        }
        .card {
            background-color: white;
            max-width: 600px;
            margin: 0 auto;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #0f172a;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #2563eb;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 20px;
        }
        p {
            color: #4b5563;
            font-size: 1.1rem;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 25px;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>مرحباً بك في موقعي الشخصي!</h1>
        <div class="subtitle">معتز ناجي</div>
        <p>أنا أتعلم برمجة وتطوير الويب خطوة بخطوة، وأقوم ببناء موقعي الأول بنفسي على شبكة الإنترنت.</p>
        <a href="#" class="btn">تواصل معي</a>
    </div>

</body>
</html>
